<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Envio em Massa - Centro Veterinário Dr. Roger Coura</title>
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; max-width: 760px; margin: 0 auto; padding: 16px; background: #f5f5f5; }
  h1 { font-size: 20px; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
  textarea { width: 100%; height: 130px; font-family: Consolas, monospace; font-size: 13px; }
  input, select, button { font-size: 14px; padding: 6px 10px; margin: 4px 0; }
  button { cursor: pointer; }
  #btnEnviar { background: #25D366; color: #fff; font-weight: bold; border: none; border-radius: 6px; padding: 10px 22px; }
  #log { background: #111; color: #0f0; font-family: Consolas, monospace; font-size: 12px; padding: 10px; height: 180px; overflow-y: auto; white-space: pre-wrap; }
  #status { font-weight: bold; padding: 4px 10px; border-radius: 12px; display: inline-block; }
  .ok { background: #d4edda; color: #155724; }
  .erro { background: #f8d7da; color: #721c24; }
  .qrcode { text-align: center; }
  img#qrImg { width: 220px; height: 220px; border: 4px solid #333; }
</style>
</head>
<body>
  <h1>🐾 Envio em Massa - WhatsApp</h1>

  <div class="card">
    <b>Status:</b> <span id="status" class="erro">Verificando...</span>
    <div id="areaQr" style="display:none" class="qrcode">
      <p>Escaneie o QR Code com o celular:<br>
      (WhatsApp &gt; Aparelhos conectados &gt; Conectar um aparelho)</p>
      <img id="qrImg" alt="QR Code">
    </div>
  </div>

  <div class="card">
    <label><b>Telefones (um por linha)</b> ou carregue a planilha:</label>
    <textarea id="txtNumeros" placeholder="61998119153&#10;(61) 99811-9153&#10;61 99811 9153"></textarea>
    <input type="file" id="filePlanilha" accept=".xlsx,.xls,.csv">
  </div>

  <div class="card">
    <label><b>Mensagem:</b></label>
    <select id="selectMsg">
      <option value="1">Mensagem 1</option>
      <option value="2">Mensagem 2</option>
      <option value="3">Mensagem 3 (+ PDF)</option>
    </select>
    <div id="divPdf" style="display:none; margin-top:6px">
      <label><b>Arquivo PDF para enviar junto com a Mensagem 3:</b></label><br>
      <input type="file" id="filePdf" accept=".pdf">
    </div>
    <label> DDD padrão (para números sem DDD):</label>
    <input type="text" id="entDdd" value="61" size="3">
    <label> Intervalo entre envios (segundos):</label>
    <input type="text" id="entIntervalo" value="10" size="3">
    <br><br>
    <button id="btnEnviar">▶ Enviar mensagens</button>
  </div>

  <div class="card">
    <b>Log:</b>
    <div id="log"></div>
  </div>

<script>
  const socket = io();
  const $ = (id) => document.getElementById(id);

  socket.on("estado", (e) => {
    if (e.conectado) setOk();
    else if (e.qr) mostrarQR(e.qr);
    else setAguardando();
  });
  socket.on("qr", (dataUrl) => mostrarQR(dataUrl));
  socket.on("status", (st) => {
    if (st === "conectado") setOk();
    else setErro(st);
  });
  socket.on("log", (txt) => addLog(txt));

  function setOk() { $("status").textContent = "✅ Conectado"; $("status").className = "ok"; $("areaQr").style.display = "none"; }
  function setErro(t) { $("status").textContent = "❌ " + t; $("status").className = "erro"; }
  function setAguardando() { $("status").textContent = "Conectando..."; $("status").className = "erro"; }
  function mostrarQR(dataUrl) {
    $("status").textContent = "Conecte o WhatsApp"; $("status").className = "erro";
    $("qrImg").src = dataUrl;
    $("areaQr").style.display = "block";
  }

  function addLog(txt) {
    const l = $("log");
    l.textContent += txt + "\n";
    l.scrollTop = l.scrollHeight;
  }

  $("filePlanilha").addEventListener("change", async (e) => {
    const arquivo = e.target.files[0];
    if (!arquivo) return;
    const dados = await arquivo.arrayBuffer();
    const wb = XLSX.read(dados);
    const ws = wb.Sheets[wb.SheetNames[0]];
    const linhas = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
    let coluna = -1;
    if (linhas.length) {
      const cab = linhas[0].map((c) => String(c).toLowerCase());
      for (let i = 0; i < cab.length; i++) {
        if (/telefone|celular|whats|fone|contato/.test(cab[i])) { coluna = i; break; }
      }
      if (coluna === -1) {
        let melhor = 0, melhorQtd = 0;
        for (let c = 0; c < cab.length; c++) {
          let qtd = 0;
          for (let r = 1; r < linhas.length; r++) {
            const v = String(linhas[r][c] || "").replace(/\D/g, "");
            if (v.length >= 8 && v.length <= 13) qtd++;
          }
          if (qtd > melhorQtd) { melhor = c; melhorQtd = qtd; }
        }
        coluna = melhor;
      }
    }
    const nums = [];
    for (let r = 1; r < linhas.length; r++) {
      const v = String(linhas[r][coluna] || "").trim();
      if (v) nums.push(v);
    }
    $("txtNumeros").value = nums.join("\n");
    addLog("📄 Planilha carregada: " + nums.length + " telefone(s).");
    e.target.value = "";
  });

  $("selectMsg").addEventListener("change", () => {
    $("divPdf").style.display = $("selectMsg").value === "3" ? "block" : "none";
  });
  $("filePdf").addEventListener("change", (e) => {
    const arquivo = e.target.files[0];
    if (!arquivo) return;
    const leitor = new FileReader();
    leitor.onload = async () => {
      const r = await fetch("/api/anexo", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ base64: leitor.result, nome: arquivo.name, tipo: arquivo.type || "application/pdf" }),
      });
      addLog(r.ok ? "📎 PDF recebido: " + arquivo.name : "❌ Falha ao enviar o PDF.");
    };
    leitor.readAsDataURL(arquivo);
  });

  $("btnEnviar").addEventListener("click", async () => {
    const numeros = $("txtNumeros").value.split("\n").map((s) => s.trim()).filter(Boolean);
    if (!numeros.length) { addLog("❌ Cole os números ou carregue a planilha."); return; }
    const corpo = {
      numeros,
      mensagem: $("selectMsg").value,
      dddPadrao: $("entDdd").value.trim() || "61",
      intervalo: parseFloat($("entIntervalo").value) || 10,
    };
    const res = await fetch("/api/enviar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(corpo),
    });
    const j = await res.json();
    if (!res.ok) addLog("❌ " + (j.erro || "Erro ao iniciar o envio."));
  });
</script>
</body>
</html>
